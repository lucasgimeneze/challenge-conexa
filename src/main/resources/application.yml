spring:
  application:
    name: conexa-challenge
  profiles:
    # Sin SPRING_PROFILES_ACTIVE arranca en dev (secreto y usuario demo de desarrollo).
    # En cualquier otro perfil JWT_SECRET es obligatorio y el usuario demo está apagado.
    default: dev
  cache:
    type: caffeine
    caffeine:
      spec: ${CACHE_SPEC:maximumSize=500,expireAfterWrite=10m}

server:
  port: ${SERVER_PORT:8080}

auth:
  jwt:
    # Obligatorio (mínimo 32 bytes, HS256): sin JWT_SECRET la app no arranca.
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:1h}
  demo-user:
    enabled: ${DEMO_USER_ENABLED:false}
    username: ${DEMO_USERNAME:}
    password: ${DEMO_PASSWORD:}

swapi:
  base-url: ${SWAPI_BASE_URL:https://www.swapi.tech/api}
  connect-timeout: ${SWAPI_CONNECT_TIMEOUT:3s}
  read-timeout: ${SWAPI_READ_TIMEOUT:5s}
